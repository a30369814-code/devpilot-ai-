name: Python unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q analyzer.py test_analyzer.py
      - name: Run unit tests
        run: python -m unittest -v
      - name: Smoke-test JSON output
        run: python analyzer.py . --json | python -c "import json,sys; data=json.load(sys.stdin); assert data['files_scanned'] >= 2; assert isinstance(data['findings'], list)"
